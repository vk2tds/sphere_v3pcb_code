; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html


; Each piece of hardware comes with a BOARD definition **AND** a PIN definition

; Boards are currently...
;   Nucleo F411RE
;   Custom PCB v1

; Pins are currently...
;   Nucleo
;   Custom PCB v1



[env:cabrai_stm32_pcbv1]
platform = ststm32
board = generic
framework = arduino
platform_packages = toolchain-gccarmnoneeabi@1.90201.191206
build_src_filter = 
    +<**/*.c>
    +<**/*.cpp>
;    -<alarm_squid.cpp> ; Exclude squid
;    -<alarm_squid.hpp> ; Exclude squid
build_flags =
    ;-D DEBUG_DS18B20
    -D BOARD_PINS_PCBV1
    -D BOARD_PRODUCT_OCTOPUS
    -D LAST_BUILD_TIME=$UNIX_TIME
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -D USBCON
    ;-D USBD_PID=0x5740 ;copied from a device built using arduino
    ;-D USBD_VID=0x0483
    -D USB_MANUFACTURER="STMicroelectronics"
    -D USB_PRODUCT="STM Serial" ; has no effect, apparantly
       -DSERIAL_UART_INSTANCE=1
       -DPIN_SERIAL_RX=PA10
       -DPIN_SERIAL_TX=PA9
       -D HSE_VALUE=8000000U
    -Wno-write-strings
    -Wno-deprecated
    -Wno-deprecated-declarations

monitor_dtr = 1
debug_tool = stlink


[platformio]
workspace_dir = bin
src_dir = src

[common]
build_flags = 
    -Wall 
    -Wextra 
    -Wformat  
    -Wshadow  
    -Wparentheses  
    -Wno-missing-field-initializers
    -Wno-write-strings
    -Wno-deprecated
    -D SERIAL_RX_BUFFER_SIZE 256
    -D SERIAL_TX_BUFFER_SIZE 256
    -D USB_RX_SIZE=256
    -D USB_TX_SIZE=256
    -D STM32CUBEDUINO_DISABLE_PRINTF_FLOAT
    -D STM32CUBEDUINO_DISABLE_SCANF_FLOAT
    -D PROJECT_NAME=cabrai
    -D PROJECT_VERSION=1
    -D GIT_BRANCH=main
    -D GIT_TAG=github

;-Wconversion -pedantic -Wunused

[env]
lib_deps = 
    ;${common.lib_deps_external}
    khoih-prog/FlashStorage_STM32@^1.2.0
    ricaun/ArduinoUniqueID@^1.3.0
    tinkerspy/Automaton@^1.0.3
    #gfy63/ParseCommands@^1.2.5
    #paulo-raca/Yet Another Arduino Wiegand Library@^2.0.0 
    paulstoffregen/Time@^1.6.1
    gbertaz/NonBlockingDallas@^1.1.0
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^4.0.4
    stm32duino/STM32duino RTC@^1.7.0
    robtillaart/CRC@^1.0.3
    #https://github.com/tonyp7/SerialRAM.git
    
    debug_tool = stlink



monitor_speed = 115200


